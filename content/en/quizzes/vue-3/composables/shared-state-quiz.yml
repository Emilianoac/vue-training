questions:
  - text: "What happens when you define `ref` inside `useX()`?"
    explanation: "Each call to `useX()` creates a new state instance, so consumers do not share that `ref` automatically."
    explanation_code:
      - code: |-
          export function useCounter() {
            const count = ref(0)
            return { count }
          }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "All consumers share the same state by default."
      - id: "3"
        isCorrect: false
        text: "Vue automatically turns it into global state."
      - id: "4"
        isCorrect: false
        text: "The state is destroyed after first render."

      - id: "1"
        isCorrect: true
        text: "Each consumer gets its own isolated instance."
  - text: "What is the effect of declaring `ref` outside the composable?"
    explanation: "If state lives in module scope, every composable call reuses the same shared reference (singleton-like pattern)."
    explanation_code:
      - code: |-
          const count = ref(0)
          export function useSharedCounter() {
            return { count }
          }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: true
        text: "It shares the same reference across all consumers."
      - id: "1"
        isCorrect: false
        text: "It creates a new copy on each `useSharedCounter()` call."
      - id: "3"
        isCorrect: false
        text: "It prevents reactivity in child components."
      - id: "4"
        isCorrect: false
        text: "It only works in SSR, not on client side."

  - text: "What is a key advantage of singleton state?"
    explanation: "A singleton provides a single source of truth, making synchronization easier across components."
    explanation_code:
      - code: |-
          const theme = ref("light")
          export function useTheme() { return { theme } }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "It completely eliminates coupling between modules."
      - id: "1"
        isCorrect: true
        text: "It keeps state synchronized across multiple consumers."
      - id: "3"
        isCorrect: false
        text: "It removes the need for mutation actions."
      - id: "4"
        isCorrect: false
        text: "It makes unit tests unnecessary."

  - text: "What is a typical risk of singleton composable state?"
    explanation: "Without boundaries, it can create implicit dependencies and make mutation tracing and test isolation harder."
    explanation_code:
      - code: |-
          // many components mutating same shared state
          shared.value = ...
        language: "text"
    answers:
      - id: "1"
        isCorrect: false
        text: "It disables reactivity."
      - id: "3"
        isCorrect: false
        text: "It only works with class components."
      - id: "2"
        isCorrect: true
        text: "It may increase coupling and reduce change traceability."
      - id: "4"
        isCorrect: false
        text: "It automatically breaks Vue lifecycle hooks."

  - text: "When is an isolated composable instance preferred?"
    explanation: "When each component needs its own lifecycle and independent state, such as unrelated forms."
    explanation_code:
      - code: |-
          const formA = useFormState()
          const formB = useFormState()
          // independent states
        language: "typescript"
    answers:
      - id: "1"
        isCorrect: true
        text: "When state should not be shared across consumers."
      - id: "2"
        isCorrect: false
        text: "When all components must read/write one global value."
      - id: "3"
        isCorrect: false
        text: "When universal persistence is required."
      - id: "4"
        isCorrect: false
        text: "When replacing a full store solution."

  - text: "What risk does module state introduce in an SSR application?"
    explanation: "If the server reuses a module across requests, a singleton can retain and expose one user's state to another."
    explanation_code:
      - code: |-
          const state = useState("reading-list", () => [])
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "It automatically turns every ref into a non-reactive value."
      - id: "3"
        isCorrect: false
        text: "It prevents the server from rendering components that use Composition API."
      - id: "1"
        isCorrect: true
        text: "It can leak state across requests unless a request-isolated mechanism is used."
      - id: "4"
        isCorrect: false
        text: "It creates an isolated copy for every request without additional configuration."

  - text: "What improves testability for singleton composables?"
    explanation: "Providing a reset action helps clean shared state between tests and avoids cross-test pollution."
    explanation_code:
      - code: |-
          function reset() { count.value = 0 }
          return { count, inc, reset }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Skip tests when singleton state exists."
      - id: "3"
        isCorrect: false
        text: "Convert all refs to primitive constants."
      - id: "4"
        isCorrect: false
        text: "Use `v-if` to reset module-level state."

      - id: "1"
        isCorrect: true
        text: "Include a reset action to clear shared state in tests."
  - text: "Which option best describes the recommended hybrid pattern?"
    explanation: "Combining local composables for per-instance state and shared composables for cross-cutting context balances isolation and synchronization."
    explanation_code:
      - code: |-
          useLocalModalState()
          useSharedTheme()
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Make everything singleton to avoid duplicates."
      - id: "1"
        isCorrect: true
        text: "Use local state per component and shared state for cross-cutting context."
      - id: "3"
        isCorrect: false
        text: "Make everything local even when global sync is required."
      - id: "4"
        isCorrect: false
        text: "Avoid composables and move everything into components."

  - text: "When should you move from a singleton composable to Pinia?"
    explanation: "When shared state grows in business rules, mutation paths, traceability needs, and tooling requirements, a formal store is usually a better fit."
    explanation_code:
      - code: |-
          // many business rules + many actions + persistence
          // => store
        language: "text"
    answers:
      - id: "2"
        isCorrect: false
        text: "When there is only one consuming component."
      - id: "3"
        isCorrect: false
        text: "When state is temporary and local to one modal."
      - id: "1"
        isCorrect: true
        text: "When complexity grows and better structure/traceability is needed."
      - id: "4"
        isCorrect: false
        text: "Never, because Pinia does not work with Composition API."

  - text: "What is a safe default rule?"
    explanation: "Starting with isolated instances avoids premature coupling. Share state only when there is a real synchronization requirement."
    explanation_code:
      - code: |-
          // default
          useLocalX()
          // promote to shared only if needed
        language: "text"
    answers:
      - id: "1"
        isCorrect: true
        text: "Start isolated and share state only when synchronization is truly needed."
      - id: "2"
        isCorrect: false
        text: "Always start with singleton to avoid multiple instances."
      - id: "3"
        isCorrect: false
        text: "Avoid composables and use only global state."
      - id: "4"
        isCorrect: false
        text: "Use list index as key to decide state scope."
