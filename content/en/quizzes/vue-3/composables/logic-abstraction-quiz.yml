documentId: "logic-abstraction-quiz"
title: "Logic Abstraction with Composables"
level: "basic"
slug: "logic-abstraction-quiz"
description: "Assess how to extract responsibilities, design clear APIs, and avoid premature abstraction with composables."
category:
  name: "Vue 3"
  image:
