documentId: "provide-inject-quiz"
title: "Provide, Inject, and Shared Context"
level: "basic"
slug: "provide-inject-quiz"
description: "Test how to share reactive context between ancestors and descendants and when to avoid props drilling."
category:
  name: "Vue 3"
  image:
    url: "https://res.cloudinary.com/du6pa3pa5/image/upload/v1765247921/vue-training/vue_0b0e7956d5.png"
questions:
  - text: "What main problem does `provide` / `inject` solve?"
    explanation: "`provide` / `inject` reduces props drilling by avoiding passing data through intermediate components that do not use it directly."
    explanation_code:
      - code: |-
          // Instead of passing props through each level:
          App -> Layout -> Sidebar -> Menu -> MenuItem
          // You can provide in App and inject in MenuItem
        language: "text"
    answers:
      - id: "1"
        isCorrect: true
        text: "Avoiding props drilling in deep component trees."
      - id: "2"
        isCorrect: false
        text: "Completely replacing props and emits."
      - id: "3"
        isCorrect: false
        text: "Automatically syncing routes between pages."
      - id: "4"
        isCorrect: false
        text: "Creating persistent global state without libraries."

  - text: "What is the correct direction for `provide` and `inject`?"
    explanation: "`provide` is declared in an ancestor (provider), and `inject` is used in a descendant (consumer)."
    explanation_code:
      - code: |-
          // Ancestor
          provide("currentUser", currentUser)

          // Descendant
          const currentUser = inject("currentUser")
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "The descendant provides and the ancestor injects."
      - id: "2"
        isCorrect: true
        text: "The ancestor provides and the descendant injects."
      - id: "3"
        isCorrect: false
        text: "Both must run in the same component."
      - id: "4"
        isCorrect: false
        text: "It only works between sibling components."

  - text: "What does `inject` return when the key is missing and no default is provided?"
    explanation: "If no provider exists for that key and no fallback is passed, `inject` returns `undefined`."
    explanation_code:
      - code: |-
          const theme = inject("theme")
          // theme will be undefined if there is no provide("theme", ...)
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "It throws an exception automatically."
      - id: "2"
        isCorrect: false
        text: "It always returns `null`."
      - id: "3"
        isCorrect: true
        text: "It returns `undefined`."
      - id: "4"
        isCorrect: false
        text: "It returns an empty `ref`."

  - text: "How can you define a fallback value when using `inject`?"
    explanation: "The second argument to inject is used when no ancestor provides the requested key."
    explanation_code:
      - code: |-
          const theme = inject("theme", "light")
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "By declaring a prop named fallback."
      - id: "2"
        isCorrect: true
        text: "By passing it as the second argument to `inject`."
      - id: "3"
        isCorrect: false
        text: "By adding it as the third argument to `provide`."
      - id: "4"
        isCorrect: false
        text: "By calling `inject.default()` after injecting."

  - text: "When is it reasonable to prefer props over `provide` / `inject`?"
    explanation: "For direct parent-child communication, props and emits are usually more explicit and traceable."
    explanation_code:
      - code: |-
          // Direct Parent -> Child communication
          <UserBadge :name="user.name" @rename="onRename" />
        language: "vue"
    answers:
      - id: "1"
        isCorrect: true
        text: "When communication is direct parent-child."
      - id: "2"
        isCorrect: false
        text: "Always when there are more than five nested levels."
      - id: "3"
        isCorrect: false
        text: "When many descendants consume the same dependency."
      - id: "4"
        isCorrect: false
        text: "When you need to decouple layout components."

  - text: "If you provide a `ref`, does the injected value stay reactive?"
    explanation: "Yes. When you provide a `ref` or `reactive`, descendants consume a shared reactive reference."
    explanation_code:
      - code: |-
          const theme = ref("dark")
          provide("theme", theme)
          // inject("theme") will reflect theme.value changes
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: true
        text: "Yes, changes are propagated reactively."
      - id: "2"
        isCorrect: false
        text: "No, inject always returns a non-reactive copy."
      - id: "3"
        isCorrect: false
        text: "Only if both components use `watchEffect`."
      - id: "4"
        isCorrect: false
        text: "Only in class components, not with `<script setup>`."

  - text: "Which situation best describes props drilling?"
    explanation: "Props drilling happens when data is passed through components that do not use it, only to reach a deeper component."
    explanation_code:
      - code: |-
          App(currentUser)
            -> Layout(currentUser)
              -> Sidebar(currentUser)
                -> MenuItem(uses currentUser)
        language: "text"
    answers:
      - id: "1"
        isCorrect: true
        text: "Passing a prop through multiple intermediate layers that do not consume it."
      - id: "2"
        isCorrect: false
        text: "Using an optional prop with a default value."
      - id: "3"
        isCorrect: false
        text: "Emitting events from a child to its parent."
      - id: "4"
        isCorrect: false
        text: "Defining typed props in TypeScript."

  - text: "What is a good use case for `provide` / `inject` in UI architecture?"
    explanation: "It is useful for shared subtree context, such as theme, form context, or local layout configuration."
    explanation_code:
      - code: |-
          provide("uiTheme", ref("dark"))
          provide("formContext", { errors, registerField })
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "Replacing a full app global store in every case."
      - id: "2"
        isCorrect: true
        text: "Sharing UI/form context between an ancestor and many descendants."
      - id: "3"
        isCorrect: false
        text: "Sending child-to-parent events without emits."
      - id: "4"
        isCorrect: false
        text: "Automatically defining protected routes."

  - text: "What risk appears when overusing `provide` / `inject`?"
    explanation: "Overuse can hide data origin and reduce traceability, since too much information becomes implicit."
    explanation_code:
      - code: |-
          // Too many implicit dependencies
          const a = inject(keyA)
          const b = inject(keyB)
          const c = inject(keyC)
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "It automatically breaks component reactivity."
      - id: "2"
        isCorrect: false
        text: "It prevents using TypeScript in child components."
      - id: "3"
        isCorrect: true
        text: "It reduces clarity about where data comes from if overused."
      - id: "4"
        isCorrect: false
        text: "It forces watchers for every injected value."

  - text: "Who should normally control mutations to provided state?"
    explanation: "Keeping mutations in the provider makes it clearer where state changes. The provider can expose specific operations together with the value."
    explanation_code:
      - code: |-
          provide("themeContext", { theme, toggleTheme })
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: true
        text: "The provider, exposing specific operations when needed."
      - id: "2"
        isCorrect: false
        text: "Any descendant, always mutating the ref directly."
      - id: "3"
        isCorrect: false
        text: "The nearest intermediate component, even if it does not use the state."
      - id: "4"
        isCorrect: false
        text: "Vue, because provided values cannot be changed manually."
