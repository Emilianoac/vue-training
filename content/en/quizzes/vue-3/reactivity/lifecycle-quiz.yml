documentId: "lifecycle-quiz"
title: "Reactivity and the Component Lifecycle in Vue 3"
level: intermediate
slug: "lifecycle-quiz"
description: "Quiz about how Vue's reactive system ties into the component lifecycle with onMounted and onUnmounted."
category:
  name: "Vue 3"
  image:
    url: "https://res.cloudinary.com/du6pa3pa5/image/upload/v1765247921/vue-training/vue_0b0e7956d5.png"
subCategory:
  id: "reactivity"
  name: "Reactivity"
  image:
    url: "/images/quizzes/categories/reactivity.webp"
topics:
  - id: "on-mounted"
    label: "onMounted"
  - id: "on-unmounted"
    label: "onUnmounted"
questions:
  - text: "When is reactive state created and initialized in a Vue component?"
    explanation: "When Vue executes `<script setup>`, reactive state (`ref`, `reactive`, `computed`, `watch`) is created and initialized immediately, even before the component exists in the DOM."
    explanation_code:
      - code: |-
          // State is created here, before the DOM
          const count = ref(0);
          const doubled = computed(() => count.value * 2);
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "In the `onMounted` hook, when the DOM is already available."
      - id: "3"
        isCorrect: false
        text: "On the first render of the component."
      - id: "2"
        isCorrect: true
        text: "When `<script setup>` runs, before the component exists in the DOM."
      - id: "4"
        isCorrect: false
        text: "When the component receives its first prop."

  - text: "Why can't you access DOM elements at the top level of `<script setup>`?"
    explanation: "When the top level of `<script setup>` runs, the component has not yet been mounted in the DOM. The DOM is only available starting from `onMounted`."
    explanation_code:
      - code: |-
          const el = ref(null);

          // ❌ null here, the DOM doesn't exist yet
          console.log(el.value);

          onMounted(() => {
            // ✅ DOM is now available
            console.log(el.value); // <div>...</div>
          });
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "Because `<script setup>` does not allow using `ref`."
      - id: "2"
        isCorrect: false
        text: "Because the DOM is mounted in a separate worker."
      - id: "4"
        isCorrect: false
        text: "Because template refs only work inside async functions."

      - id: "3"
        isCorrect: true
        text: "Because the component has not been mounted in the DOM yet when the top level of setup runs."
  - text: "What is the correct place to make an API call that will feed reactive state?"
    explanation: "`onMounted` is the ideal place to fetch external data, since at that point the DOM is available and reactive state is active. When the state is updated, Vue will automatically re-render the component."
    explanation_code:
      - code: |-
          const users = ref([]);

          onMounted(async () => {
            const response = await fetch("/api/users");
            users.value = await response.json(); // Vue re-renders
          });
        language: "javascript"
    answers:
      - id: "2"
        isCorrect: true
        text: "In `onMounted`, where reactive state is already active and the DOM is available."
      - id: "1"
        isCorrect: false
        text: "At the top level of `<script setup>` so data is ready before the first render."
      - id: "3"
        isCorrect: false
        text: "In `onUnmounted`, to optimize performance."
      - id: "4"
        isCorrect: false
        text: "In `onBeforeMount`, so data arrives before Vue mounts the component."

  - text: "What happens automatically to watchers when a component is unmounted?"
    explanation: "Watchers created with `watch` or `watchEffect` inside `<script setup>` stop automatically when the component is unmounted. Vue binds them to the component lifecycle during their creation."
    explanation_code:
      - code: |-
          const count = ref(0);

          // Stops automatically when the component unmounts
          watchEffect(() => {
            console.log("count:", count.value);
          });
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "They keep running in the background indefinitely."
      - id: "3"
        isCorrect: true
        text: "They stop automatically because Vue binds them to the component lifecycle."
      - id: "2"
        isCorrect: false
        text: "They must always be stopped manually using their return value."
      - id: "4"
        isCorrect: false
        text: "They pause until the component mounts again."

  - text: "When is it necessary to stop a watcher manually?"
    explanation: "If a watcher is created outside the synchronous setup context (for example, inside a `setTimeout` or an async function called from `onMounted`), Vue cannot bind it to the component lifecycle and it must be stopped manually."
    explanation_code:
      - code: |-
          let stopWatcher;

          onMounted(() => {
            // Created outside the initial setup context
            stopWatcher = watchEffect(() => {
              console.log(count.value);
            });
          });

          onUnmounted(() => {
            stopWatcher(); // Must be stopped manually
          });
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "Always, regardless of where the watcher is created."
      - id: "2"
        isCorrect: false
        text: "Never, Vue always manages it automatically."
      - id: "3"
        isCorrect: false
        text: "Only when using `watch`, not with `watchEffect`."
      - id: "4"
        isCorrect: true
        text: "When created outside the synchronous setup context, such as inside onMounted or a setTimeout."

  - text: "What kind of resources must be cleaned up manually in `onUnmounted`?"
    explanation: "Vue automatically manages the watchers and reactive effects it created, but external side effects such as `setInterval`, DOM event listeners, or subscriptions to external services must be cleaned up manually in `onUnmounted`."
    explanation_code:
      - code: |-
          onMounted(() => {
            window.addEventListener("resize", handleResize);
          });

          onUnmounted(() => {
            // Vue doesn't manage this; must be cleaned up manually
            window.removeEventListener("resize", handleResize);
          });
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "Watchers created with `watch` or `watchEffect` at the top level of setup."
      - id: "3"
        isCorrect: true
        text: "Intervals, external event listeners, and subscriptions to services not managed by Vue."
      - id: "2"
        isCorrect: false
        text: "Computed properties."
      - id: "4"
        isCorrect: false
        text: "`ref` and `reactive` values."

  - text: "What happens to reactive state when it is updated inside `onMounted`?"
    explanation: "Vue's reactive system detects any change to `ref` or `reactive` regardless of where the update happens. When state is updated in `onMounted`, Vue schedules a re-render and updates the DOM automatically."
    explanation_code:
      - code: |-
          const title = ref("Loading...");

          onMounted(async () => {
            const data = await fetch("/api/config").then(r => r.json());
            title.value = data.title; // → Vue re-renders the template
          });
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "The change is not detected because `onMounted` runs outside the reactive cycle."
      - id: "2"
        isCorrect: false
        text: "The change is applied but the DOM is not updated until the next manual tick."
      - id: "4"
        isCorrect: true
        text: "Vue detects the change and updates the DOM automatically."

      - id: "3"
        isCorrect: false
        text: "It throws an error because the DOM is already mounted."
  - text: "You are building a component that loads data when it appears on screen and cleans up a resource when it leaves. Where should each part go?"
    explanation: "Reactive state is declared at the top level of `<script setup>`. Data loading can happen in `onMounted`, once the component is mounted, and external resource cleanup belongs in `onUnmounted`."
    explanation_code:
      - code: |-
          const data = ref(null);
          let intervalId;

          onMounted(() => {
            data.value = "ready";
            intervalId = setInterval(() => {}, 1000);
          });

          onUnmounted(() => {
            clearInterval(intervalId);
          });
        language: "javascript"
    answers:
      - id: "3"
        isCorrect: true
        text: "Declare state in setup, load data in `onMounted`, and clean up the resource in `onUnmounted`."
      - id: "1"
        isCorrect: false
        text: "Declare state in `onMounted` and clean up the resource at the top level of setup."
      - id: "2"
        isCorrect: false
        text: "Declare state in `onUnmounted`, load data in setup, and clean up in `onMounted`."
      - id: "4"
        isCorrect: false
        text: "Do everything in `onMounted`, because Vue automatically cleans up any external resource."

  - text: "What advantage does creating a composable that combines reactive state with `onMounted` and `onUnmounted` offer?"
    explanation: "A composable can encapsulate reactive state along with its initialization in `onMounted` and cleanup in `onUnmounted`. When called from `<script setup>`, the hooks are correctly registered in the lifecycle of the consuming component."
    explanation_code:
      - code: |-
          // useOnlineStatus.ts
          export function useOnlineStatus() {
            const isOnline = ref(navigator.onLine);
            const handleOnline = () => { isOnline.value = true; };
            const handleOffline = () => { isOnline.value = false; };

            onMounted(() => {
              window.addEventListener("online", handleOnline);
              window.addEventListener("offline", handleOffline);
            });

            onUnmounted(() => {
              window.removeEventListener("online", handleOnline);
              window.removeEventListener("offline", handleOffline);
            });

            return { isOnline };
          }
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "None, hooks do not work outside a component."
      - id: "3"
        isCorrect: true
        text: "It encapsulates state and lifecycle effects, reusable in any component."
      - id: "2"
        isCorrect: false
        text: "It allows calling onMounted multiple times from the same component."
      - id: "4"
        isCorrect: false
        text: "It prevents the component from needing to import `ref` or `reactive`."

  - text: "Why is it important to clear a `setInterval` in `onUnmounted`?"
    explanation: "If the interval is not cleared when the component unmounts, it will keep running in memory even though the component is no longer on screen. This can cause memory leaks and update state on a destroyed component, generating errors."
    explanation_code:
      - code: |-
          const time = ref(new Date().toLocaleTimeString());
          let intervalId;

          onMounted(() => {
            intervalId = setInterval(() => {
              time.value = new Date().toLocaleTimeString();
            }, 1000);
          });

          onUnmounted(() => {
            clearInterval(intervalId); // Prevents memory leak
          });
        language: "javascript"
    answers:
      - id: "1"
        isCorrect: false
        text: "Because Vue throws an error if it detects an active interval on unmount."
      - id: "2"
        isCorrect: false
        text: "Because the interval stops automatically when the component unmounts."
      - id: "3"
        isCorrect: false
        text: "Because `setInterval` is not compatible with Vue's reactive system."
      - id: "4"
        isCorrect: true
        text: "To prevent memory leaks and updating state on an already-destroyed component."
