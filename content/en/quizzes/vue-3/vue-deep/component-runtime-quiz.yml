documentId: component-runtime-quiz
title: Component Runtime
level: advanced
slug: component-runtime-quiz
description: Test how Vue turns definitions and VNodes into instances with inputs, context, and lifecycle.
category:
  name: Vue 3
  image:
    url: https://res.cloudinary.com/du6pa3pa5/image/upload/v1765247921/vue-training/vue_0b0e7956d5.png
