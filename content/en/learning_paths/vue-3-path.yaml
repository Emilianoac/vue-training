documentId: vue-3-path
title: "Learning Path: Vue 3"
steps:
  - name: Reactivity
    sub_steps:
      - name: Principles of Reactivity
        id: reactivity-principles
        items:
          - id: reactive-state-lesson
            type: lesson
            level: basic
            title: Reactivity in Vue 3
            subtitle: Fundamentals of reactivity with ref, reactive, and optimizations.

          - id: reactive-state-quiz
            type: quiz
            level: basic
            title: Reactivity Quiz
            subtitle: Test your understanding of reactivity concepts in Vue 3.

          - id: ref-counter-state
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Complete a counter component to practice reactive state with ref.

      - name: Computed Properties
        id: computed-properties
        items:
          - id: computed-properties-lesson
            type: lesson
            level: basic
            title: Computed Properties
            subtitle: Learn how to use computed properties to derive state efficiently.

          - id: computed-properties-quiz
            type: quiz
            level: basic
            title: Computed Properties Quiz
            subtitle: Test your knowledge of computed properties in Vue 3.

          - id: computed-user-filter
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Complete a user filter component using computed properties.

      - name: Watchers
        id: watchers
        items:
          - id: watchers-lesson
            type: lesson
            level: basic
            title: Watchers in Vue 3
            subtitle: Learn to react to state changes with watch and watchEffect.

          - id: watchers-quiz
            type: quiz
            level: intermediate
            title: Watchers Quiz
            subtitle: Test your understanding of watchers and side effects in Vue 3.

          - id: watch-question-log
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Complete a component that reacts to question changes using watch.

      - name: Reactivity and Lifecycle
        id: reactivity-lifecycle
        items:
          - id: lifecycle-lesson
            type: lesson
            level: basic
            title: Reactivity and the Component Lifecycle
            subtitle: Understand how reactive state connects to component mounting and unmounting.

          - id: lifecycle-quiz
            type: quiz
            level: intermediate
            title: Lifecycle Quiz
            subtitle: Test when to use onMounted, onUnmounted, and how to clean up external effects.

          - id: lifecycle-session-monitor
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Complete a component that starts and cleans up external resources with lifecycle hooks.

  - name: Components
    sub_steps:
      - name: Component Communication
        id: component-communication
        items:
          - id: props-emits-lesson
            type: lesson
            level: basic
            title: Basic Component Communication
            subtitle: Learn how to pass data with props and notify changes with emits.

          - id: props-emits-quiz
            type: quiz
            level: basic
            title: Quiz 1
            subtitle: Test your understanding of props, emits, and parent-child communication.

          - id: props-emits-quantity-stepper
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Complete a controlled component that communicates changes with update:modelValue.

      - name: Slots and Layouts
        id: slots-layouts
        items:
          - id: slots-layout-lesson
            type: lesson
            level: basic
            title: Slots and Interface Composition
            subtitle: Learn to create flexible components with default, named, and scoped slots.

          - id: slots-layout-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test how content is defined, provided, and organized through slots.

          - id: slots-profile-panel
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Build a reusable panel and fill its regions from the parent component.

      - name: Provide / Inject
        id: provide-inject
        items:
          - id: provide-inject-lesson
            type: lesson
            level: basic
            title: Sharing Context with Provide and Inject
            subtitle: Share reactive values between ancestors and descendants without props drilling.

          - id: provide-inject-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test provide, inject, reactivity, and usage decisions.

          - id: provide-inject-theme
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Connect a theme provider to a reactive descendant.

      - name: Render Control
        id: render-control
        items:
          - id: render-control-lesson
            type: lesson
            level: basic
            title: Render Control in Vue 3
            subtitle: Control existence, visibility, and identity with directives and dynamic components.

          - id: render-control-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test v-if, v-show, key, dynamic components, and KeepAlive.

          - id: dynamic-settings-tabs
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Build dynamic tabs that preserve their component state.

      - name: Component Design
        id: component-design
        items:
          - id: component-design-lesson
            type: lesson
            level: basic
            title: Component Design in Vue 3
            subtitle: Distribute responsibilities and define clear contracts between components.

          - id: component-design-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test component responsibilities, contracts, naming, and organization.

          - id: user-directory-components
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Split a user directory into a container and a presentational component.

  - name: Composables
    sub_steps:
      - name: Basic Composables
        id: basic-composables
        items:
          - id: basic-composables-lesson
            type: lesson
            level: basic
            title: Basic Composables in Vue 3
            subtitle: Encapsulate reactive logic behind functions with a clear API.

          - id: basic-composables-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test composable definitions, conventions, encapsulation, and consumption.

          - id: use-disclosure-panel
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Extract a panel's state and actions into a composable.

      - name: Shared State
        id: shared-state
        items:
          - id: shared-state-lesson
            type: lesson
            level: basic
            title: Shared State with Composables
            subtitle: Decide when each consumer needs an instance or a shared reactive source.

          - id: shared-state-quiz
            type: quiz
            level: advanced
            title: Quiz 1
            subtitle: Test state scope, lifetime, SSR, and state tool selection.

          - id: shared-reading-list
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Synchronize two consumers through a shared-state composable.

      - name: Effects and Lifecycle
        id: composable-effects
        items:
          - id: composable-effects-lesson
            type: lesson
            level: basic
            title: Effects and Lifecycle in Composables
            subtitle: Bind watchers and external resources to each consumer's lifecycle.

          - id: composable-effects-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test internal watchers, lifecycle, SSR, and effect cleanup.

          - id: keyboard-shortcut-listener
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Register and clean up a keyboard shortcut from a composable.

      - name: Logic Abstraction
        id: logic-abstraction
        items:
          - id: logic-abstraction-lesson
            type: lesson
            level: basic
            title: Logic Abstraction with Composables
            subtitle: Extract responsibilities and design reusable APIs without abstracting too early.

          - id: logic-abstraction-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test responsibilities, clear contracts, and the cost of creating abstractions.

          - id: async-resource-loader
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Abstract asynchronous loading behind a reusable API with explicit dependencies.

      - name: Advanced Patterns
        id: advanced-patterns
        items:
          - id: advanced-patterns-lesson
            type: lesson
            level: basic
            title: Advanced Composable Patterns
            subtitle: Design flexible inputs, protected state, and configurable composables with clear contracts.

          - id: advanced-patterns-quiz
            type: quiz
            level: advanced
            title: Quiz 1
            subtitle: Test reactive inputs, readonly, factories, composition, and effect scopes.

          - id: flexible-task-filter
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Create a filter that accepts values, refs, or getters without losing reactivity.

  - name: Ecosystem
    sub_steps:
      - name: Routing
        id: routing
        items:
          - id: routing-lesson
            type: lesson
            level: basic
            title: Routing with Vue Router
            subtitle: Connect URLs to views and handle params, query, navigation, and guards.

          - id: routing-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test dynamic routes, nested views, history, and navigation with Vue Router.

          - id: dynamic-user-profile
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Build a profile that reacts to a dynamic route parameter.

      - name: Global State
        id: global-state
        items:
          - id: global-state-lesson
            type: lesson
            level: basic
            title: Global State with Pinia
            subtitle: Share state, getters, and actions across components through Pinia stores.

          - id: global-state-quiz
            type: quiz
            level: intermediate
            title: Quiz 1
            subtitle: Test stores, state, getters, actions, and reactive consumption with Pinia.

          - id: shared-cart-store
            type: challenge
            level: intermediate
            title: Challenge 1
            subtitle: Build a shopping cart whose state is shared across multiple components.

  - name: Vue in Depth
    sub_steps:
      - name: Effects and Dependency Tracking
        id: effect-dependency-tracking
        items:
          - id: effect-dependency-tracking-lesson
            type: lesson
            level: basic
            title: Effects and Dependency Tracking
            subtitle: Rebuild the link between a reactive read, an effect, and a later update.

          - id: effect-dependency-tracking-quiz
            type: quiz
            level: advanced
            title: Effects Quiz
            subtitle: Test how dependency tracking connects reads to updates.

          - id: effect-dependency-tracking
            type: challenge
            level: advanced
            title: Challenge 1
            subtitle: Implement a basic dependency graph with effect, track, trigger, and Proxy.

      - name: Reactive Primitives
        id: reactive-primitives
        items:
          - id: reactive-primitives-lesson
            type: lesson
            level: basic
            title: Rebuilding Reactive Primitives
            subtitle: Rebuild reactive, ref, readonly, and linked references on the same dependency system.

          - id: reactive-primitives-quiz
            type: quiz
            level: advanced
            title: Reactive Primitives Quiz
            subtitle: Test how different primitives preserve identity, tracking, and links to state.

          - id: reactive-primitives
            type: challenge
            level: advanced
            title: Challenge 1
            subtitle: Implement reduced versions of reactive, ref, readonly, toRef, and toRefs.

      - name: Derived State and Observation
        id: derived-state-observation
        items:
          - id: derived-state-observation-lesson
            type: lesson
            level: basic
            title: Derived State and Reactive Observation
            subtitle: Rebuild computed, watch, and watchEffect through caching, invalidation, and cleanup.

          - id: derived-state-observation-quiz
            type: quiz
            level: advanced
            title: Derived State Quiz
            subtitle: Test caching, watched sources, invalidation, and side-effect cleanup.

          - id: derived-state-observation
            type: challenge
            level: advanced
            title: Challenge 1
            subtitle: Implement reduced versions of computed, watch, and watchEffect.

      - name: Component Runtime
        id: component-runtime
        items:
          - id: component-runtime-lesson
            type: lesson
            level: basic
            title: How a Component Runs
            subtitle: Understand how a definition becomes an instance with setup, inputs, rendering, and lifecycle.

          - id: component-runtime-quiz
            type: quiz
            level: advanced
            title: Component Runtime Quiz
            subtitle: Test instances, setup, input channels, context, and lifecycle.

          - id: component-runtime
            type: challenge
            level: advanced
            title: Challenge 1
            subtitle: Implement a reduced runtime that prepares and runs component instances.

  - name: Quality
    sub_steps:
      - name: Testing
        id: testing
        status: planned
        items: []

      - name: TypeScript and Typing
        id: typescript-typing
        status: planned
        items: []
