documentId: vue-3-path
title: "Learning Path: Vue 3"
steps:
  - name: Reactivity
    sub_steps:
      - name: Principles of Reactivity
        id: reactivity-principles
        items:
          - id: reactive-state-lesson
            type: lesson
            level: basic
            title: Reactivity in Vue 3
            subtitle: Fundamentals of reactivity with ref, reactive, and optimizations.

          - id: reactive-state-quiz
            type: quiz
            level: basic
            title: Reactivity Quiz
            subtitle: Test your understanding of reactivity concepts in Vue 3.

          - id: ref-counter-state
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Complete a counter component to practice reactive state with ref.

      - name: Computed Properties
        id: computed-properties
        items:
          - id: computed-properties-lesson
            type: lesson
            level: basic
            title: Computed Properties
            subtitle: Learn how to use computed properties to derive state efficiently.

          - id: computed-properties-quiz
            type: quiz
            level: basic
            title: Computed Properties Quiz
            subtitle: Test your knowledge of computed properties in Vue 3.

          - id: computed-user-filter
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Complete a user filter component using computed properties.

      - name: Watchers
        id: watchers
        items:
          - id: watchers-lesson
            type: lesson
            level: basic
            title: Watchers in Vue 3
            subtitle: Learn to react to state changes with watch and watchEffect.

          - id: watchers-quiz
            type: quiz
            level: basic
            title: Watchers Quiz
            subtitle: Test your understanding of watchers and side effects in Vue 3.

          - id: watch-question-log
            type: challenge
            level: basic
            title: Challenge 1
            subtitle: Complete a component that reacts to question changes using watch.

