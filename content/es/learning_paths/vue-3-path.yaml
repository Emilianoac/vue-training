documentId: vue-3-path
title: "Camino de Aprendizaje: Vue 3"
steps:
  - name: Reactividad
    sub_steps:
      - name: Principios de la Reactividad
        id: reactivity-principles
        items:
          - id: reactive-state-lesson
            type: lesson
            level: basic
            title: Reactividad en Vue 3
            subtitle: Fundamentos de la reactividad con ref, reactive y optimizaciones.

          - id: reactive-state-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de los conceptos de reactividad en Vue 3.

          - id: ref-counter-state
            type: challenge
            level: basic
            title: Desafio 1
            subtitle: Resuelve un desafío práctico para aplicar tus conocimientos sobre reactividad en Vue 3.

      - name: Computed Properties
        id: computed-properties
        items:
          - id: computed-properties-lesson
            type: lesson
            level: basic
            title: Computed Properties
            subtitle: Aprende a usar computed properties para derivar estado de manera eficiente.

          - id: computed-properties-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Pon a prueba tu conocimiento sobre computed properties en Vue 3.

          - id: computed-user-filter
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente para filtrar usuarios usando computed properties.

      - name: Watchers
        id: watchers
        items:
          - id: watchers-lesson
            type: lesson
            level: basic
            title: Watchers en Vue 3
            subtitle: Aprende a reaccionar a cambios del estado con watch y watchEffect.

          - id: watchers-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de watchers y efectos secundarios en Vue 3.

          - id: watch-question-log
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Completa un componente que reacciona a cambios de una pregunta usando watch.

      - name: Reactividad y Ciclo de Vida
        id: reactivity-lifecycle
        items:
          - id: lifecycle-lesson
            type: lesson
            level: basic
            title: Reactividad y Ciclo de Vida
            subtitle: Comprende cómo el estado reactivo se conecta al montaje y desmontaje del componente.

          - id: lifecycle-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa cuándo usar onMounted, onUnmounted y cómo limpiar efectos externos.

          - id: lifecycle-session-monitor
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Completa un componente que inicia y limpia recursos externos con hooks de ciclo de vida.

  - name: Componentes
    sub_steps:
      - name: Comunicación entre Componentes
        id: component-communication
        items:
          - id: props-emits-lesson
            type: lesson
            level: basic
            title: Comunicación Básica entre Componentes
            subtitle: Aprende cómo pasar datos con props y notificar cambios con emits.

          - id: props-emits-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de props, emits y comunicación padre-hijo.

          - id: props-emits-quantity-stepper
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Completa un componente controlado que comunica cambios con update:modelValue.

      - name: Slots y Layouts
        id: slots-layouts
        items:
          - id: slots-layout-lesson
            type: lesson
            level: basic
            title: Slots y composición de interfaces
            subtitle: Aprende a crear componentes flexibles con slots por defecto, slots con nombre y scoped slots.

          - id: slots-layout-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa cómo se define, proporciona y organiza contenido mediante slots.

          - id: slots-profile-panel
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Construye un panel reutilizable y completa sus regiones desde el componente padre.

      - name: Provide / Inject
        id: provide-inject
        items:
          - id: provide-inject-lesson
            type: lesson
            level: basic
            title: Compartir contexto con Provide e Inject
            subtitle: Comparte valores reactivos entre ancestros y descendientes sin props drilling.

          - id: provide-inject-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa provide, inject, reactividad y decisiones de uso.

          - id: provide-inject-theme
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Conecta un proveedor de tema con un descendiente reactivo.

      - name: Control de Render
        id: render-control
        items:
          - id: render-control-lesson
            type: lesson
            level: basic
            title: Control de render en Vue 3
            subtitle: Controla existencia, visibilidad e identidad con directivas y componentes dinámicos.

          - id: render-control-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa v-if, v-show, key, componentes dinámicos y KeepAlive.

          - id: dynamic-settings-tabs
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Construye pestañas dinámicas que conserven el estado de sus componentes.

      - name: Diseño de Componentes
        id: component-design
        items:
          - id: component-design-lesson
            type: lesson
            level: basic
            title: Diseño de componentes en Vue 3
            subtitle: Distribuye responsabilidades y define contratos claros entre componentes.

          - id: component-design-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa responsabilidades, contratos, nombres y organización de componentes.

          - id: user-directory-components
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Separa un directorio de usuarios en un contenedor y un componente presentacional.

  - name: Composables
    sub_steps:
      - name: Composables Básicos
        id: basic-composables
        items:
          - id: basic-composables-lesson
            type: lesson
            level: basic
            title: Composables básicos en Vue 3
            subtitle: Encapsula lógica reactiva detrás de funciones con una API clara.

          - id: basic-composables-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa definición, convenciones, encapsulación y consumo de composables.

          - id: use-disclosure-panel
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Extrae el estado y las acciones de un panel a un composable.

      - name: Estado Compartido
        id: shared-state
        items:
          - id: shared-state-lesson
            type: lesson
            level: basic
            title: Estado compartido con composables
            subtitle: Decide cuándo cada consumidor necesita una instancia o una fuente reactiva común.

          - id: shared-state-quiz
            type: quiz
            level: advanced
            title: Cuestionario 1
            subtitle: Evalúa alcance, tiempo de vida, SSR y elección de herramientas de estado.

          - id: shared-reading-list
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Sincroniza dos consumidores mediante un composable con estado compartido.

      - name: Efectos y Lifecycle
        id: composable-effects
        items:
          - id: composable-effects-lesson
            type: lesson
            level: basic
            title: Efectos y ciclo de vida en composables
            subtitle: Vincula watchers y recursos externos al ciclo de vida de cada consumidor.

          - id: composable-effects-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa watchers internos, ciclo de vida, SSR y limpieza de efectos.

          - id: keyboard-shortcut-listener
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Registra y limpia un atajo de teclado desde un composable.

      - name: Abstracción de Lógica
        id: logic-abstraction
        items:
          - id: logic-abstraction-lesson
            type: lesson
            level: basic
            title: Abstracción de lógica con composables
            subtitle: Extrae responsabilidades y diseña APIs reutilizables sin abstraer antes de tiempo.

          - id: logic-abstraction-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa responsabilidades, contratos claros y el costo de crear abstracciones.

          - id: async-resource-loader
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Abstrae la carga asíncrona detrás de una API reutilizable con dependencias explícitas.

      - name: Patrones Avanzados
        id: advanced-patterns
        items:
          - id: advanced-patterns-lesson
            type: lesson
            level: basic
            title: Patrones avanzados para composables
            subtitle: Diseña entradas flexibles, estado protegido y composables configurables con contratos claros.

          - id: advanced-patterns-quiz
            type: quiz
            level: advanced
            title: Cuestionario 1
            subtitle: Evalúa entradas reactivas, readonly, factories, composición y scopes de efectos.

          - id: flexible-task-filter
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Crea un filtro que acepte valores, refs o getters sin perder reactividad.

  - name: Ecosistema
    sub_steps:
      - name: Routing
        id: routing
        items:
          - id: routing-lesson
            type: lesson
            level: basic
            title: Routing con Vue Router
            subtitle: Relaciona URLs con vistas y maneja params, query, navegación y guards.

          - id: routing-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa rutas dinámicas, vistas anidadas, historial y navegación con Vue Router.

          - id: dynamic-user-profile
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Crea un perfil que reaccione al parámetro dinámico de la ruta.

      - name: Estado Global
        id: global-state
        items:
          - id: global-state-lesson
            type: lesson
            level: basic
            title: Estado global con Pinia
            subtitle: Comparte estado, getters y acciones entre componentes mediante stores de Pinia.

          - id: global-state-quiz
            type: quiz
            level: intermediate
            title: Cuestionario 1
            subtitle: Evalúa stores, state, getters, actions y consumo reactivo con Pinia.

          - id: shared-cart-store
            type: challenge
            level: intermediate
            title: Desafío 1
            subtitle: Construye un carrito cuyo estado se comparta entre varios componentes.

  - name: Vue en profundidad
    sub_steps:
      - name: Efectos y seguimiento de dependencias
        id: effect-dependency-tracking
        items:
          - id: effect-dependency-tracking-lesson
            type: lesson
            level: basic
            title: Efectos y seguimiento de dependencias
            subtitle: Reconstruye el vínculo entre una lectura reactiva, un efecto y una actualización posterior.

          - id: effect-dependency-tracking-quiz
            type: quiz
            level: advanced
            title: Cuestionario de efectos
            subtitle: Evalúa cómo el seguimiento de dependencias conecta lecturas con actualizaciones.

          - id: effect-dependency-tracking
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa un grafo básico de dependencias con effect, track, trigger y Proxy.

      - name: Primitivas reactivas
        id: reactive-primitives
        items:
          - id: reactive-primitives-lesson
            type: lesson
            level: basic
            title: Reconstruir primitivas reactivas
            subtitle: Reconstruye reactive, ref, readonly y referencias enlazadas sobre el mismo sistema de dependencias.

          - id: reactive-primitives-quiz
            type: quiz
            level: advanced
            title: Cuestionario de primitivas reactivas
            subtitle: Evalúa cómo distintas primitivas conservan identidad, seguimiento y enlaces con el estado.

          - id: reactive-primitives
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa versiones reducidas de reactive, ref, readonly, toRef y toRefs.

      - name: Estado derivado y observación
        id: derived-state-observation
        items:
          - id: derived-state-observation-lesson
            type: lesson
            level: basic
            title: Estado derivado y observación reactiva
            subtitle: Reconstruye computed, watch y watchEffect mediante caché, invalidación y limpieza.

          - id: derived-state-observation-quiz
            type: quiz
            level: advanced
            title: Cuestionario de estado derivado
            subtitle: Evalúa caché, fuentes observadas, invalidación y limpieza de efectos secundarios.

          - id: derived-state-observation
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa versiones reducidas de computed, watch y watchEffect.

      - name: Runtime de componentes
        id: component-runtime
        items:
          - id: component-runtime-lesson
            type: lesson
            level: basic
            title: Cómo se ejecuta un componente
            subtitle: Comprende cómo una definición se convierte en una instancia con setup, entradas, render y lifecycle.

          - id: component-runtime-quiz
            type: quiz
            level: advanced
            title: Cuestionario de runtime de componentes
            subtitle: Evalúa instancias, setup, canales de entrada, contexto y ciclo de vida.

          - id: component-runtime
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa un runtime reducido que prepare y ejecute instancias de componentes.

      - name: Programación de actualizaciones
        id: update-scheduling
        items:
          - id: update-scheduling-lesson
            type: lesson
            level: basic
            title: Programar actualizaciones reactivas
            subtitle: Comprende batching, orden de jobs, fases de watchers y nextTick dentro del scheduler.

          - id: update-scheduling-quiz
            type: quiz
            level: advanced
            title: Cuestionario de programación de actualizaciones
            subtitle: Evalúa batching, deduplicación, orden del flush y timing de watchers.

          - id: update-scheduling
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa una cola de jobs con batching, fases de flush y nextTick.

      - name: Renderizado y componentes
        id: rendering-components
        items:
          - id: rendering-components-lesson
            type: lesson
            level: basic
            title: De VNodes al DOM
            subtitle: Comprende cómo el renderer monta, compara y actualiza elementos y componentes.

          - id: rendering-components-quiz
            type: quiz
            level: advanced
            title: Cuestionario de renderizado
            subtitle: Evalúa VNodes, mount, patch, componentes, children e identidad mediante key.

          - id: rendering-components
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa un renderer reducido para elementos, componentes y listas keyed.

      - name: Compilación de templates
        id: template-compilation
        items:
          - id: template-compilation-lesson
            type: lesson
            level: basic
            title: De templates a estrategias de renderizado
            subtitle: Comprende cómo Vue convierte templates en instrucciones de render optimizadas y cómo Vapor cambia el destino de compilación.

          - id: template-compilation-quiz
            type: quiz
            level: advanced
            title: Cuestionario de compilación
            subtitle: Evalúa AST, transformaciones, codegen, optimizaciones del compiler y Vapor Mode.

          - id: template-compilation
            type: challenge
            level: advanced
            title: Desafío 1
            subtitle: Implementa un compilador reducido que transforma templates en funciones de render.

  - name: Calidad
    sub_steps:
      - name: Testing
        id: testing
        status: planned
        items: []

      - name: TypeScript y Tipado
        id: typescript-typing
        status: planned
        items: []
