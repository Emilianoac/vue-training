documentId: vue-3-path
title: "Camino de Aprendizaje: Vue 3"
steps:
  - name: Reactividad
    sub_steps:
      - name: Principios de la Reactividad
        id: reactivity-principles
        items:
          - id: reactive-state-lesson
            type: lesson
            level: basic
            title: Reactividad en Vue 3
            subtitle: Fundamentos de la reactividad con ref, reactive y optimizaciones.

          - id: reactive-state-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de los conceptos de reactividad en Vue 3.

          - id: ref-counter-state
            type: challenge
            level: basic
            title: Desafio 1
            subtitle: Resuelve un desafío práctico para aplicar tus conocimientos sobre reactividad en Vue 3.

      - name: Computed Properties
        id: computed-properties
        items:
          - id: computed-properties-lesson
            type: lesson
            level: basic
            title: Computed Properties
            subtitle: Aprende a usar computed properties para derivar estado de manera eficiente.

          - id: computed-properties-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Pon a prueba tu conocimiento sobre computed properties en Vue 3.

          - id: computed-user-filter
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente para filtrar usuarios usando computed properties.

      - name: Watchers
        id: watchers
        items:
          - id: watchers-lesson
            type: lesson
            level: basic
            title: Watchers en Vue 3
            subtitle: Aprende a reaccionar a cambios del estado con watch y watchEffect.

          - id: watchers-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de watchers y efectos secundarios en Vue 3.

          - id: watch-question-log
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente que reacciona a cambios de una pregunta usando watch.

      - name: Reactividad y Ciclo de Vida
        id: reactivity-lifecycle
        items:
          - id: lifecycle-lesson
            type: lesson
            level: basic
            title: Reactividad y Ciclo de Vida
            subtitle: Comprende cómo el estado reactivo se conecta al montaje y desmontaje del componente.

          - id: lifecycle-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa cuándo usar onMounted, onUnmounted y cómo limpiar efectos externos.

          - id: lifecycle-session-monitor
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente que inicia y limpia recursos externos con hooks de ciclo de vida.

