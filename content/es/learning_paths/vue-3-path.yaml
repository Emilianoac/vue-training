documentId: vue-3-path
title: "Camino de Aprendizaje: Vue 3"
steps:
  - name: Reactividad
    sub_steps:
      - name: Principios de la Reactividad
        id: reactivity-principles
        items:
          - id: reactive-state-lesson
            type: lesson
            level: basic
            title: Reactividad en Vue 3
            subtitle: Fundamentos de la reactividad con ref, reactive y optimizaciones.

          - id: reactive-state-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de los conceptos de reactividad en Vue 3.

          - id: ref-counter-state
            type: challenge
            level: basic
            title: Desafio 1
            subtitle: Resuelve un desafío práctico para aplicar tus conocimientos sobre reactividad en Vue 3.

      - name: Computed Properties
        id: computed-properties
        items:
          - id: computed-properties-lesson
            type: lesson
            level: basic
            title: Computed Properties
            subtitle: Aprende a usar computed properties para derivar estado de manera eficiente.

          - id: computed-properties-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Pon a prueba tu conocimiento sobre computed properties en Vue 3.

          - id: computed-user-filter
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente para filtrar usuarios usando computed properties.

      - name: Watchers
        id: watchers
        items:
          - id: watchers-lesson
            type: lesson
            level: basic
            title: Watchers en Vue 3
            subtitle: Aprende a reaccionar a cambios del estado con watch y watchEffect.

          - id: watchers-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de watchers y efectos secundarios en Vue 3.

          - id: watch-question-log
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente que reacciona a cambios de una pregunta usando watch.

      - name: Reactividad y Ciclo de Vida
        id: reactivity-lifecycle
        items:
          - id: lifecycle-lesson
            type: lesson
            level: basic
            title: Reactividad y Ciclo de Vida
            subtitle: Comprende cómo el estado reactivo se conecta al montaje y desmontaje del componente.

          - id: lifecycle-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa cuándo usar onMounted, onUnmounted y cómo limpiar efectos externos.

          - id: lifecycle-session-monitor
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente que inicia y limpia recursos externos con hooks de ciclo de vida.

  - name: Componentes
    sub_steps:
      - name: Comunicación entre Componentes
        id: component-communication
        items:
          - id: props-emits-lesson
            type: lesson
            level: basic
            title: Comunicación Básica entre Componentes
            subtitle: Aprende cómo pasar datos con props y notificar cambios con emits.

          - id: props-emits-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa tu comprensión de props, emits y comunicación padre-hijo.

          - id: props-emits-quantity-stepper
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Completa un componente controlado que comunica cambios con update:modelValue.

      - name: Slots y Layouts
        id: slots-layouts
        items:
          - id: slots-layout-lesson
            type: lesson
            level: basic
            title: Slots y composición de interfaces
            subtitle: Aprende a crear componentes flexibles con slots por defecto, slots con nombre y scoped slots.

          - id: slots-layout-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa cómo se define, proporciona y organiza contenido mediante slots.

          - id: slots-profile-panel
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Construye un panel reutilizable y completa sus regiones desde el componente padre.

      - name: Provide / Inject
        id: provide-inject
        items:
          - id: provide-inject-lesson
            type: lesson
            level: basic
            title: Compartir contexto con Provide e Inject
            subtitle: Comparte valores reactivos entre ancestros y descendientes sin props drilling.

          - id: provide-inject-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa provide, inject, reactividad y decisiones de uso.

          - id: provide-inject-theme
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Conecta un proveedor de tema con un descendiente reactivo.

      - name: Control de Render
        id: render-control
        items:
          - id: render-control-lesson
            type: lesson
            level: basic
            title: Control de render en Vue 3
            subtitle: Controla existencia, visibilidad e identidad con directivas y componentes dinámicos.

          - id: render-control-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa v-if, v-show, key, componentes dinámicos y KeepAlive.

          - id: dynamic-settings-tabs
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Construye pestañas dinámicas que conserven el estado de sus componentes.

      - name: Diseño de Componentes
        id: component-design
        items:
          - id: component-design-lesson
            type: lesson
            level: basic
            title: Diseño de componentes en Vue 3
            subtitle: Distribuye responsabilidades y define contratos claros entre componentes.

          - id: component-design-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa responsabilidades, contratos, nombres y organización de componentes.

          - id: user-directory-components
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Separa un directorio de usuarios en un contenedor y un componente presentacional.

  - name: Composables
    sub_steps:
      - name: Composables Básicos
        id: basic-composables
        items:
          - id: basic-composables-lesson
            type: lesson
            level: basic
            title: Composables básicos en Vue 3
            subtitle: Encapsula lógica reactiva detrás de funciones con una API clara.

          - id: basic-composables-quiz
            type: quiz
            level: basic
            title: Cuestionario 1
            subtitle: Evalúa definición, convenciones, encapsulación y consumo de composables.

          - id: use-disclosure-panel
            type: challenge
            level: basic
            title: Desafío 1
            subtitle: Extrae el estado y las acciones de un panel a un composable.

      - name: Estado Compartido
        id: shared-state
        status: planned
        items: []

      - name: Efectos y Lifecycle
        id: composable-effects
        status: planned
        items: []

      - name: Abstracción de Lógica
        id: logic-abstraction
        status: planned
        items: []

      - name: Patrones Avanzados
        id: advanced-patterns
        status: planned
        items: []

  - name: Ecosistema
    sub_steps:
      - name: Routing
        id: routing
        status: planned
        items: []

      - name: Estado Global
        id: global-state
        status: planned
        items: []

  - name: Calidad
    sub_steps:
      - name: Testing
        id: testing
        status: planned
        items: []

      - name: TypeScript y Tipado
        id: typescript-typing
        status: planned
        items: []
