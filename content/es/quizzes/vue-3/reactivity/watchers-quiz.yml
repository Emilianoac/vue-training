documentId: watchers-quiz
title: Watchers en Vue 3
level: intermediate
slug: watchers-quiz
description: Evaluación sobre los fundamentos de watch, fuentes reactivas, callbacks y buenas prácticas.
category:
  name: Vue 3
  image:
    url: https://res.cloudinary.com/du6pa3pa5/image/upload/v1765247921/vue-training/vue_0b0e7956d5.png
subCategory:
  id: reactivity
