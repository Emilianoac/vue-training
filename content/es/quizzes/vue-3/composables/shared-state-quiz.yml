documentId: "shared-state-quiz"
title: "Estado compartido con composables"
level: "basic"
slug: "shared-state-quiz"
description: "Evaluación sobre estado por instancia, estado de módulo, APIs controladas, SSR y stores."
category:
  name: "Vue 3"
  image:
    url: "https://res.cloudinary.com/du6pa3pa5/image/upload/v1765247921/vue-training/vue_0b0e7956d5.png"
subCategory:
  id: "composables"
  name: "Composables"
  image:
    url: "/images/quizzes/categories/composables.webp"
topics:
  - id: "composables"
    label: "composables"
  - id: "ref"
    label: "ref"
  - id: "readonly"
    label: "readonly"
questions:
  - text: "¿Qué ocurre cuando defines `ref` dentro de `useX()`?"
    explanation: "Cada llamada a `useX()` crea una nueva instancia de estado, por lo que los consumidores no comparten ese `ref` automáticamente."
    explanation_code:
      - code: |-
          export function useCounter() {
            const count = ref(0)
            return { count }
          }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Todos los consumidores comparten el mismo estado por defecto."
      - id: "3"
        isCorrect: false
        text: "Vue convierte ese estado automáticamente en global."
      - id: "4"
        isCorrect: false
        text: "El estado se destruye al primer render."

      - id: "1"
        isCorrect: true
        text: "Cada consumidor obtiene su propia instancia aislada."
  - text: "¿Qué efecto tiene declarar `ref` fuera del composable?"
    explanation: "Si el estado está en el scope de módulo, todas las llamadas al composable reutilizan la misma referencia compartida (patrón singleton)."
    explanation_code:
      - code: |-
          const count = ref(0)
          export function useSharedCounter() {
            return { count }
          }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: true
        text: "Comparte la misma referencia entre todos los consumidores."
      - id: "1"
        isCorrect: false
        text: "Crea una copia nueva en cada llamada a `useSharedCounter()`."
      - id: "3"
        isCorrect: false
        text: "Impide reactividad en componentes hijos."
      - id: "4"
        isCorrect: false
        text: "Solo funciona en SSR y no en cliente."

  - text: "¿Cuál es una ventaja clave de un singleton?"
    explanation: "Un singleton ofrece una sola fuente de verdad, facilitando sincronización entre componentes que consumen el mismo estado."
    explanation_code:
      - code: |-
          const theme = ref("light")
          export function useTheme() { return { theme } }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Evita totalmente el acoplamiento entre módulos."
      - id: "1"
        isCorrect: true
        text: "Mantiene sincronizado el estado entre múltiples consumidores."
      - id: "3"
        isCorrect: false
        text: "Elimina la necesidad de acciones para mutar estado."
      - id: "4"
        isCorrect: false
        text: "Hace innecesario usar pruebas unitarias."

  - text: "¿Cuál es un riesgo típico del estado singleton en composables?"
    explanation: "Si se usa sin control, genera dependencias implícitas y hace más difícil rastrear mutaciones y aislar tests."
    explanation_code:
      - code: |-
          // muchos componentes mutando el mismo estado compartido
          shared.value = ...
        language: "text"
    answers:
      - id: "1"
        isCorrect: false
        text: "No permite reactividad."
      - id: "3"
        isCorrect: false
        text: "Solo funciona con componentes de clase."
      - id: "2"
        isCorrect: true
        text: "Puede incrementar acoplamiento y dificultar trazabilidad de cambios."
      - id: "4"
        isCorrect: false
        text: "Rompe el ciclo de vida de Vue automáticamente."

  - text: "¿Cuándo conviene una instancia aislada por composable?"
    explanation: "Cuando cada componente necesita su propio ciclo de vida y estado independiente, por ejemplo formularios no relacionados."
    explanation_code:
      - code: |-
          const formA = useFormState()
          const formB = useFormState()
          // estados independientes
        language: "typescript"
    answers:
      - id: "1"
        isCorrect: true
        text: "Cuando el estado no debe compartirse entre consumidores."
      - id: "2"
        isCorrect: false
        text: "Cuando todos los componentes deben ver el mismo valor global."
      - id: "3"
        isCorrect: false
        text: "Cuando necesitas persistencia universal."
      - id: "4"
        isCorrect: false
        text: "Cuando quieres reemplazar un store completo."

  - text: "¿Qué riesgo tiene el estado de módulo en una aplicación con SSR?"
    explanation: "Si el servidor reutiliza el módulo entre solicitudes, un singleton puede conservar y exponer estado de un usuario a otro."
    explanation_code:
      - code: |-
          const state = useState("reading-list", () => [])
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Convierte automáticamente todas las refs en valores no reactivos."
      - id: "3"
        isCorrect: false
        text: "Impide que el servidor renderice componentes que utilizan Composition API."
      - id: "1"
        isCorrect: true
        text: "Puede filtrar estado entre solicitudes si no se utiliza un mecanismo aislado por request."
      - id: "4"
        isCorrect: false
        text: "Crea una copia aislada para cada solicitud sin configuración adicional."

  - text: "¿Qué estrategia mejora testabilidad en composables singleton?"
    explanation: "Exponer una acción de reset ayuda a restaurar estado entre tests y evita contaminación entre casos."
    explanation_code:
      - code: |-
          function reset() { count.value = 0 }
          return { count, inc, reset }
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Evitar tests cuando hay singleton."
      - id: "3"
        isCorrect: false
        text: "Convertir todos los refs en constantes primitivas."
      - id: "4"
        isCorrect: false
        text: "Usar `v-if` para reiniciar el estado del módulo."

      - id: "1"
        isCorrect: true
        text: "Incluir una acción de reset para limpiar estado compartido en pruebas."
  - text: "¿Qué opción describe mejor el patrón híbrido recomendado?"
    explanation: "Combinar composables locales para estado de instancia y composables compartidos para contexto transversal ofrece equilibrio entre aislamiento y sincronización."
    explanation_code:
      - code: |-
          useLocalModalState()
          useSharedTheme()
        language: "typescript"
    answers:
      - id: "2"
        isCorrect: false
        text: "Hacer todo singleton para evitar duplicación."
      - id: "1"
        isCorrect: true
        text: "Usar local para estado por componente y shared para contexto transversal."
      - id: "3"
        isCorrect: false
        text: "Hacer todo local aunque se requiera sincronización global."
      - id: "4"
        isCorrect: false
        text: "Evitar composables y mover todo a componentes."

  - text: "¿Cuándo conviene pasar de singleton composable a Pinia?"
    explanation: "Cuando el estado compartido crece en reglas, mutaciones, trazabilidad y necesidades de devtools/persistencia, un store formal suele encajar mejor."
    explanation_code:
      - code: |-
          // muchas reglas de negocio + multiples acciones + persistencia
          // => store
        language: "text"
    answers:
      - id: "2"
        isCorrect: false
        text: "Cuando hay un solo componente consumidor."
      - id: "3"
        isCorrect: false
        text: "Cuando el estado es temporal y local de un modal."
      - id: "1"
        isCorrect: true
        text: "Cuando aumenta complejidad y se necesita mejor trazabilidad/estructura."
      - id: "4"
        isCorrect: false
        text: "Nunca, Pinia no aplica con Composition API."

  - text: "¿Cuál es una regla segura por defecto?"
    explanation: "Empezar con instancias aisladas reduce acoplamiento prematuro; compartir estado solo cuando haya necesidad real de sincronización."
    explanation_code:
      - code: |-
          // default
          useLocalX()
          // promote to shared only if needed
        language: "text"
    answers:
      - id: "1"
        isCorrect: true
        text: "Comenzar con estado aislado y compartir solo por necesidad real."
      - id: "2"
        isCorrect: false
        text: "Comenzar siempre con singleton para evitar crear varias instancias."
      - id: "3"
        isCorrect: false
        text: "Evitar composables y usar solo estado global."
      - id: "4"
        isCorrect: false
        text: "Usar index como key para decidir tipo de estado."
