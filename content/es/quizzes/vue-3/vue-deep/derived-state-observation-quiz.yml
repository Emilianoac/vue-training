documentId: derived-state-observation-quiz
title: Estado derivado y observación
level: advanced
slug: derived-state-observation-quiz
description: Evalúa cómo computed, watch y watchEffect responden a invalidaciones reactivas.
category:
  name: Vue 3
  image:
