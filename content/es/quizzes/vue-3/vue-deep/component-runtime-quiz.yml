questions:
  - text: ¿En qué se diferencian la definición de un componente, un VNode y una instancia?
    explanation: La definición describe un tipo reutilizable, el VNode declara una aparición concreta y la instancia conserva el estado vivo de esa aparición entre renders.
    explanation_code:
      - code: |-
          const definition = { setup, render };
          const vnode = h(definition, { start: 2 });
          const instance = createComponentInstance(vnode, parent);
        language: js
    answers:
      - id: "1"
        isCorrect: true
        text: La definición describe el tipo, el VNode una aparición y la instancia su estado vivo.
      - id: "2"
        isCorrect: false
        text: Los tres nombres representan exactamente el mismo objeto.
      - id: "3"
        isCorrect: false
        text: La instancia solo contiene el HTML ya insertado en el DOM.
      - id: "4"
        isCorrect: false
        text: El VNode guarda siempre todo el estado mutable de setup.

  - text: ¿Por qué necesita su propia instancia cada aparición montada de una misma definición?
    explanation: La definición se reutiliza, pero cada aparición necesita conservar props, setupState, hooks y subTree independientes.
    explanation_code:
      - code: |-
          const first = createComponentInstance(h(Counter), parent);
          const second = createComponentInstance(h(Counter), parent);

          first !== second; // true
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: Para compilar una copia diferente de JavaScript por cada render.
      - id: "2"
        isCorrect: true
        text: Para que cada aparición conserve estado y lifecycle independientes.
      - id: "3"
        isCorrect: false
        text: Para impedir que dos componentes usen la misma función render.
      - id: "4"
        isCorrect: false
        text: Para transformar automáticamente todos sus atributos en props.

  - text: ¿Qué representa el subTree de una instancia?
    explanation: La función de render de un componente produce VNodes. La instancia conserva ese resultado como subTree para montarlo o compararlo con el siguiente.
    explanation_code:
      - code: |-
          instance.subTree = instance.render.call(instance.proxy);
          mountSubTree(instance.subTree);
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: La lista completa de ancestros de la aplicación.
      - id: "2"
        isCorrect: false
        text: Una copia de todas las props declaradas por los hijos.
      - id: "3"
        isCorrect: true
        text: El árbol de VNodes producido por el render de esa instancia.
      - id: "4"
        isCorrect: false
        text: El código fuente original del template sin compilar.

  - text: ¿Cómo decide el runtime si un valor entrante pertenece a props o attrs?
    explanation: El runtime compara cada key con la declaración de props. Las keys no declaradas y que tampoco sean listeners declarados permanecen en attrs.
    explanation_code:
      - code: |-
          if (declaredProps.has(key)) {
            instance.props[key] = value;
          } else {
            instance.attrs[key] = value;
          }
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: Por el tipo primitivo del valor recibido.
      - id: "2"
        isCorrect: false
        text: Por el orden en que aparecen las keys del objeto.
      - id: "3"
        isCorrect: false
        text: Considera props únicamente los valores reactivos.
      - id: "4"
        isCorrect: true
        text: Usa la declaración de props y conserva lo no reconocido en attrs.

  - text: ¿Por qué normaliza el runtime los slots como funciones?
    explanation: Una función permite que el hijo decida cuándo y dónde obtener VNodes, conserve el contexto de render del padre y entregue slot props.
    explanation_code:
      - code: |-
          slots.header = (slotProps) =>
            normalizeVNodes(rawHeader(slotProps));
        language: js
    answers:
      - id: "1"
        isCorrect: true
        text: Para producir VNodes bajo demanda y admitir datos entregados por el hijo.
      - id: "2"
        isCorrect: false
        text: Para convertir cada slot directamente en un elemento DOM permanente.
      - id: "3"
        isCorrect: false
        text: Para obligar al slot a ejecutarse solo una vez en toda la aplicación.
      - id: "4"
        isCorrect: false
        text: Para eliminar el contexto reactivo del componente padre.

  - text: ¿Qué propósito cumple currentInstance mientras se ejecuta setup()?
    explanation: La instancia activa permite que APIs llamadas de forma síncrona sepan dónde registrar dependencias, providers y hooks sin exponer la instancia como argumento.
    explanation_code:
      - code: |-
          currentInstance = instance;
          const result = setup(props, context);
          currentInstance = previous;
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: Guardar el último elemento DOM creado por cualquier componente.
      - id: "2"
        isCorrect: true
        text: Asociar provide, inject y lifecycle con el componente que ejecuta setup.
      - id: "3"
        isCorrect: false
        text: Convertir automáticamente setup en una función asíncrona.
      - id: "4"
        isCorrect: false
        text: Compartir setupState entre todas las instancias del mismo tipo.

  - text: ¿Qué ocurre cuando setup() retorna un objeto?
    explanation: El runtime guarda esos bindings como setupState y puede aplicar proxyRefs para que el render acceda a refs sin .value en cada lectura.
    explanation_code:
      - code: |-
          const result = setup(props, context);
          instance.setupState = proxyRefs(result);
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: El objeto reemplaza la definición completa del componente.
      - id: "2"
        isCorrect: false
        text: Cada propiedad se convierte automáticamente en un atributo DOM.
      - id: "3"
        isCorrect: true
        text: Sus bindings se almacenan en setupState para que el render pueda resolverlos.
      - id: "4"
        isCorrect: false
        text: El runtime lo interpreta siempre como un VNode raíz terminado.

  - text: ¿Dónde encuentra emit() el listener del padre para un evento del componente?
    explanation: El listener pertenece a las props del VNode que el padre creó para esa instancia. El evento de componente no necesita ascender por todos los ancestros.
    explanation_code:
      - code: |-
          const handler = instance.vnode.props?.onSave;
          handler?.(payload);
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: En todos los elementos DOM descendientes del componente.
      - id: "2"
        isCorrect: false
        text: En un registro global compartido por todas las aplicaciones.
      - id: "3"
        isCorrect: false
        text: Únicamente dentro del objeto setupState del hijo.
      - id: "4"
        isCorrect: true
        text: En las props del VNode actual mediante el nombre de handler normalizado.

  - text: ¿Cómo puede una cadena de prototipos de provides resolver el valor del ancestro más cercano?
    explanation: Cada proveedor crea una capa que hereda de su padre. Una key propia oculta la heredada en esa rama y una key ausente continúa la búsqueda por el prototipo.
    explanation_code:
      - code: |-
          child.provides = Object.create(parent.provides);
          child.provides.theme = 'dark';
        language: js
    answers:
      - id: "1"
        isCorrect: true
        text: Cada capa puede ocultar una key y delegar las demás al registro heredado.
      - id: "2"
        isCorrect: false
        text: Copia todos los providers de toda la aplicación antes de cada inject.
      - id: "3"
        isCorrect: false
        text: Busca siempre desde la raíz e ignora proveedores más cercanos.
      - id: "4"
        isCorrect: false
        text: Convierte cualquier valor proporcionado en una variable global.

  - text: ¿Por qué puede el runtime reutilizar una instancia cuando el siguiente VNode tiene el mismo tipo y key?
    explanation: Esa combinación conserva la identidad lógica. El runtime actualiza props y slots, vuelve a renderizar y mantiene setupState y hooks de la instancia.
    explanation_code:
      - code: |-
          if (oldVNode.type === nextVNode.type
            && oldVNode.key === nextVNode.key) {
            updateComponent(instance, nextVNode);
          }
        language: js
    answers:
      - id: "1"
        isCorrect: false
        text: Porque las nuevas props se descartan por completo.
      - id: "2"
        isCorrect: true
        text: Porque mantiene la misma identidad y puede conservar su estado entre renders.
      - id: "3"
        isCorrect: false
        text: Porque toda key obliga a crear una instancia nueva.
      - id: "4"
        isCorrect: false
        text: Porque el tipo del componente deja de importar después del montaje.
