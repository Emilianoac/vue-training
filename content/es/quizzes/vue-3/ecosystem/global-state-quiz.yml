documentId: global-state-quiz
title: Estado global con Pinia
level: intermediate
slug: global-state-quiz
description: Evaluación sobre stores, state, getters, actions y consumo reactivo con Pinia.
category:
  name: Vue 3
  image:
    url: https://res.cloudinary.com/du6pa3pa5/image/upload/v1765247921/vue-training/vue_0b0e7956d5.png
