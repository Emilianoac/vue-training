<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Vue Training · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
      }

      img {
        width: 4rem;
      }

      p {
        color: #94a3b8;
        line-height: 1.6;
      }

      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.375rem;
        padding: 0.65rem 1rem;
        background: #42b883;
        color: #020617;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon.svg" alt="" />
      <h1>You're offline · Estás sin conexión</h1>
      <p>
        Reconnect to open content that has not been cached yet.<br />
        Vuelve a conectarte para abrir contenido que todavía no está guardado.
      </p>
      <button type="button" onclick="location.reload()">Retry · Reintentar</button>
    </main>
  </body>
</html>
